# Fetches the day-ahead prices and publishes the JSON file on GitHub Pages.
#
# GitHub starts scheduled runs late and skips many of them: in the first days of the
# trial runs started 2 to 4.5 hours late and only about one in four ran at all.
# So the workflow is scheduled every half hour, off the full hour, from 11:13 to 22:43 UTC
# (12:13 to 23:43 in winter, 13:13 to 00:43 in summer, Dutch time). It only takes one run.
#
# The first run that finds tomorrow's prices writes and publishes the file.
# Later runs change nothing. Which day a run checks follows the local clock, not the schedule:
# before noon today, from noon on tomorrow. When that day is still missing from 22:00 local,
# or in the morning of the day itself, the job "missing" fails once for that day,
# so that someone gets a message. trial/alarm.txt remembers which day was reported.

name: day-prices
on:
  schedule:
    - cron: "13,43 11-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: day-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      code: ${{ steps.fetch.outputs.code }}
      publish: ${{ steps.commit.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Offline checks
        run: python3 script/test_fetch_day_prices.py
      - name: Fetch prices
        id: fetch
        # Exit code 3: the day is not published yet, normal for the early runs.
        # Exit code 4: the day is overdue, reported once; the job "missing" turns it into a failure.
        run: |
          set +e
          python3 script/fetch_day_prices.py --log-csv trial/log.csv --alarm-state trial/alarm.txt
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in 0|3|4) exit 0 ;; *) exit "$code" ;; esac
      - name: Commit what changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs trial
          publish=false
          if ! git diff --cached --quiet -- docs; then publish=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then publish=true; fi
          if ! git diff --cached --quiet; then
            git commit -m "Day-ahead prices updated"
            git push
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Package the site
        if: steps.commit.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publish:
    needs: fetch
    if: needs.fetch.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  missing:
    needs: fetch
    if: needs.fetch.outputs.code == '4'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The day-ahead prices for the next day are overdue at the source. See the log of the job fetch for the day."
          exit 1
